# Netlify build settings. They override whatever is set in the Netlify UI.
[build]
  command = "npm run build"
  # `next build` writes the static site here (see `output: "export"` in next.config.ts).
  publish = "out"

[build.environment]
  # Next.js 16 needs Node 20.9 or newer.
  NODE_VERSION = "22"
  # Netlify adds its Next.js adapter to every Next.js site. This site is a plain static
  # export, and the adapter would reject `out` as the publish folder, so turn it off.
  NETLIFY_NEXT_PLUGIN_SKIP = "true"
